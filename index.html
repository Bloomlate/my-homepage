<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조용한 서재</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
<style>
/* 색·글꼴 (문구·사진·자료는 data.js 에서 바꿉니다) */
:root{--fg:#363636;--mut:#8a8178;--acc:#9a7b4f;--line:#e8e3dc;--ph:#ece6dc;--band:#f7f4ef}
*{box-sizing:border-box;margin:0}
body{font:18px/1.8 Pretendard,Poppins,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--fg);background:#fff;word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Cormorant Garamond',Pretendard,serif;font-style:italic}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#ffffffee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
header .ic{display:grid;place-items:center;background:none;border:0;font-size:24px;cursor:pointer;padding:8px;border-radius:8px;transition:.2s}
header .ic svg{width:24px;height:24px}
header .ic:hover{background:#f3efe8}
header .logo{position:absolute;left:50%;transform:translateX(-50%);font-family:'Courier New',Pretendard,monospace;font-weight:700;text-align:center;line-height:1.1;font-size:18px;white-space:nowrap}
#drawer{position:fixed;inset:0;z-index:30;pointer-events:none}
#drawer .bg{position:absolute;inset:0;background:#0006;opacity:0;transition:.3s}
#drawer .pn{position:absolute;top:0;bottom:0;left:0;width:min(340px,86vw);background:#fff;transform:translateX(-100%);transition:.3s;padding:24px 28px;overflow:auto}
#drawer.open{pointer-events:auto}#drawer.open .bg{opacity:1}#drawer.open .pn{transform:none}
#drawer .x{font-size:28px;background:none;border:0;cursor:pointer;margin-bottom:12px}
.mi{border-bottom:1px solid var(--line)}
.mi>button,.mi>a{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;padding:14px 2px;font:400 18px Poppins,Pretendard,sans-serif;letter-spacing:.06em;cursor:pointer}
.mi>button:hover,.mi>a:hover{color:var(--acc)}
.mi .pm:after{content:"+"}.mi.open .pm:after{content:"−"}
.mi .sub{max-height:0;overflow:hidden;transition:max-height .3s;padding-left:14px}
.mi.open .sub{max-height:500px;padding-bottom:10px}
.sub a{display:block;padding:5px 0;font:300 18px Poppins,Pretendard,sans-serif;color:var(--mut)}.sub a:hover{color:var(--acc)}
main{padding-top:64px;min-height:70vh}
/* 첫 화면 */
.hero{height:62vh;min-height:420px;position:relative;overflow:hidden;background:var(--ph)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s;display:flex;align-items:center;padding:0 8vw;color:#fff;background-size:cover;background-position:center}
.slide:before{content:"";position:absolute;inset:0;background:#0000002e}.slide>div{position:relative}.slide.on{opacity:1}
.slide h1{font:italic 400 clamp(40px,6vw,76px)/1.15 'Cormorant Garamond',Pretendard,serif;margin-bottom:12px}
.slide p{font:300 clamp(18px,1.8vw,22px)/1.6 Poppins,Pretendard,sans-serif}
.slide h1,.slide p{opacity:0;transform:translateY(28px)}
.slide.on h1{animation:rise 1s .3s forwards}.slide.on p{animation:rise 1s .6s forwards}
@keyframes rise{to{opacity:1;transform:none}}
.dots{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dots button{all:unset;cursor:pointer;padding:6px}
.dots button:before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:#fff8}.dots button.on:before{background:#fff}
/* 스크롤할 때 나타나기 */
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s ease,transform .9s ease}
.rv.in{opacity:1;transform:none}
.intro{text-align:center;padding:96px 24px 56px}
.intro small{display:block;color:var(--acc);font-size:18px;margin-bottom:16px}
.intro h2{font-weight:400;font-size:clamp(24px,3vw,34px);line-height:1.4}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:0 24px}
.cards a span{display:block;padding:12px 0 0;font:400 18px Poppins,Pretendard,sans-serif;letter-spacing:.1em}
.cards a em{display:block;font-style:normal;color:var(--mut);font-size:18px}
.ph{aspect-ratio:3/4;background:var(--ph);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s;display:block}
.cards a:hover .ph img{transform:scale(1.05)}
.about{text-align:center;padding:140px 24px}
.about h3{font-family:'Cormorant Garamond',Pretendard,serif;font-weight:400;font-size:36px;margin-bottom:24px}
.about p{color:var(--mut);line-height:2;max-width:640px;margin:0 auto}
.btn{display:inline-block;margin-top:24px;border:1px solid var(--fg);background:#fff;padding:10px 32px;border-radius:99px;font:400 18px Poppins,Pretendard,sans-serif;letter-spacing:.1em;transition:.2s;cursor:pointer}
.btn:hover,.btn.f{background:var(--fg);color:#fff}.btn.f:hover{background:var(--acc);border-color:var(--acc)}
.faq{max-width:900px;margin:0 auto;padding:40px 24px 120px}
.faq h3{font:400 40px 'Cormorant Garamond',Pretendard,serif;margin-bottom:12px}
.faq>p{color:var(--mut);margin-bottom:40px}
.q{border-top:1px solid var(--line)}.q:last-child{border-bottom:1px solid var(--line)}
.q button{all:unset;box-sizing:border-box;width:100%;display:flex;gap:24px;padding:22px 4px;cursor:pointer;font-size:19px;transition:.2s}
.q button:hover{color:var(--acc)}
.q em{font:400 18px Poppins,sans-serif;color:var(--acc);padding-top:1px;font-style:normal}
.q .a{max-height:0;overflow:hidden;transition:max-height .35s;color:var(--mut);padding:0 4px 0 52px;font-size:18px}
.q.open .a{max-height:400px;padding-bottom:22px}
.band{text-align:center;padding:120px 24px;background:var(--band)}
.band h3{font:italic 400 clamp(30px,4vw,52px)/1.3 'Cormorant Garamond',Pretendard,serif}
/* 하위 페이지 */
.page{max-width:1100px;margin:0 auto;padding:72px 24px 100px}
.page h1{font:400 clamp(34px,5vw,52px)/1.2 'Cormorant Garamond',Pretendard,serif;text-align:center;margin-bottom:12px}
.page .sub1{text-align:center;color:var(--mut);margin-bottom:48px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.tabs a{padding:6px 18px;border-radius:99px;border:1px solid var(--line);font:400 18px Poppins,Pretendard,sans-serif;letter-spacing:.08em;transition:.2s}
.tabs a:hover{border-color:var(--acc)}.tabs a.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.masonry{columns:3;column-gap:14px;margin-top:24px}
.masonry img{width:100%;margin-bottom:14px;display:block;cursor:zoom-in;break-inside:avoid;transition:.3s;background:var(--ph);min-height:120px}
.masonry img:hover{opacity:.85}
#lb{position:fixed;inset:0;z-index:50;background:#000e;display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:90vw;max-height:88vh;object-fit:contain}
#lb button{position:absolute;background:#fff2;border:0;color:#fff;font-size:28px;width:52px;height:52px;border-radius:50%;cursor:pointer;transition:.2s}
#lb button:hover{background:#fff5}
#lb .p{left:20px}#lb .n{right:20px}#lb .c{top:20px;right:20px}
#lb span{position:absolute;bottom:20px;color:#fffa;font:18px Poppins,sans-serif}
.form{max-width:640px;margin:0 auto;display:grid;gap:14px}
.form[hidden]{display:none}
.form label{display:grid;gap:6px;font-size:18px;color:var(--mut)}
.form input,.form textarea{border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);transition:.2s;background:#fff;width:100%;min-width:0}
.form input:focus,.form textarea:focus{outline:0;border-color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:18px}
th,td{padding:14px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:500 18px Poppins,Pretendard,sans-serif;color:var(--mut);letter-spacing:.08em;white-space:nowrap}
td.no,td.dt{white-space:nowrap;color:var(--mut)}
tr.row{cursor:pointer;transition:.2s}tr.row:hover{background:#faf6ef}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#f1e9da;color:var(--acc);font-size:18px;line-height:1.5}
.empty{text-align:center;color:var(--mut);padding:48px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.post h2{font-weight:500;font-size:26px;margin-bottom:6px}.post .meta{color:var(--mut);font-size:18px;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
.post .link{display:inline-block;margin-bottom:20px;color:var(--acc);border-bottom:1px solid var(--acc);word-break:break-all}
footer{padding:64px 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:32px;font-size:18px;color:var(--mut);max-width:1280px;margin:0 auto}
footer h4{font:500 18px Poppins,Pretendard,sans-serif;letter-spacing:.15em;color:var(--fg);margin-bottom:12px}
footer a{display:block}footer a:hover{color:var(--acc)}
footer .flogo{font-family:'Courier New',Pretendard,monospace;font-weight:700;font-size:22px;color:var(--fg);line-height:1.2}
.copy{text-align:center;color:#a39b92;font-size:18px;padding:0 24px 40px}
@media(max-width:760px){.cards,.info{grid-template-columns:1fr}.masonry{columns:2}footer{grid-template-columns:1fr 1fr;padding:56px 24px}
header{padding:0 16px}.about{padding:100px 24px}.q .a{padding-left:4px}.q button{gap:16px}
th.no,td.no{display:none}}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.slide h1,.slide p{opacity:1;transform:none;animation:none!important}}
</style>
</head>
<body>
<header>
 <button class="ic" id="mbtn" aria-label="메뉴">≡</button>
 <a class="logo" href="#/" id="logo"></a>
 <a class="ic" href="#/library/all" aria-label="전체 자료" title="전체 자료"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M8 7h7"/></svg></a>
</header>
<div id="drawer"><div class="bg"></div><div class="pn"><button class="x" id="mx" aria-label="닫기">×</button><div id="menu"></div></div></div>
<main id="app"></main>
<div id="lb"><button class="c" aria-label="닫기">×</button><button class="p" aria-label="이전 사진">‹</button><img alt=""><button class="n" aria-label="다음 사진">›</button><span></span></div>
<footer>
 <div><h4>INFO</h4><span data-site="title"></span><br>오늘은 <time id="today"></time></div>
 <div><h4>LIBRARY</h4><div id="fcat"></div></div>
 <div><h4>GUIDE</h4><a href="#/guide">처음 쓰실 때</a><a href="#/library/all">전체 자료</a></div>
 <div class="flogo" id="flogo"></div>
</footer>
<p class="copy">© <span id="year"></span> <span data-site="title"></span> — 화면에서 추가한 자료는 이 브라우저에만 저장됩니다</p>
<script src="data.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('ql_'+k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('ql_'+k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const CAT=Object.fromEntries(CATEGORIES.map(c=>[c.id,c]));
const photo=(c,i)=>c.photo||HERO_PHOTOS[i%HERO_PHOTOS.length];
const logo=()=>esc(SITE.title).replace(' ','<br>')+'.';

document.title=SITE.title;
$$('[data-site]').forEach(el=>el.textContent=SITE[el.dataset.site]);
$('#logo').innerHTML=logo();$('#flogo').innerHTML=logo();
const now=new Date();$('#today').dateTime=fmt(now);$('#today').textContent=`${now.getFullYear()}년 ${now.getMonth()+1}월 ${now.getDate()}일`;$('#year').textContent=now.getFullYear();
$('#fcat').innerHTML=CATEGORIES.map(c=>`<a href="#/library/${c.id}">${esc(c.name)}</a>`).join('');

/* 서랍 메뉴 */
const NAV=[["HOME","#/"],["LIBRARY",[["ALL · 전체","library/all"]].concat(CATEGORIES.map(c=>[c.name,'library/'+c.id]))],["GUIDE",[["처음 쓰실 때","guide"]]]];
$('#menu').innerHTML=NAV.map(([t,s])=>typeof s==='string'?`<div class="mi"><a href="${s}">${t}</a></div>`:`<div class="mi"><button>${t}<span class="pm"></span></button><div class="sub">${s.map(([n,h])=>`<a href="#/${h}">${n}</a>`).join('')}</div></div>`).join('');
$$('.mi>button').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
const dr=$('#drawer'),openM=v=>dr.classList.toggle('open',v);
$('#mbtn').onclick=()=>openM(true);$('#mx').onclick=()=>openM(false);$('.bg',dr).onclick=()=>openM(false);
$$('a',dr).forEach(a=>a.addEventListener('click',()=>openM(false)));

/* 사진 크게 보기 */
let LB=[],li=0;const lb=$('#lb');
function showLB(list,i){LB=list;li=i;lb.classList.add('on');updLB()}
function updLB(){$('img',lb).src=LB[li];$('span',lb).textContent=(li+1)+' / '+LB.length}
$('.c',lb).onclick=()=>lb.classList.remove('on');
$('.p',lb).onclick=()=>{li=(li-1+LB.length)%LB.length;updLB()};
$('.n',lb).onclick=()=>{li=(li+1)%LB.length;updLB()};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')openM(false);if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowLeft')$('.p',lb).click();if(e.key==='ArrowRight')$('.n',lb).click()});

function faqInit(){const f=$('#faq');if(!f)return;f.innerHTML=FAQ.map((x,i)=>`<div class="q${i?'':' open'}"><button><em>0${i+1}</em>${esc(x[0])}</button><div class="a">${esc(x[1])}</div></div>`).join('');$$('.q button',f).forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'))}
let timer;
function sliderInit(){clearInterval(timer);const s=$$('.slide'),d=$$('.dots button');if(!s.length)return;let n=0;
const go=i=>{n=i;s.forEach((e,k)=>{if(k==i&&!e.style.backgroundImage)e.style.backgroundImage=`url("${e.dataset.src}")`;e.classList.toggle('on',k==i)});d.forEach((e,k)=>e.classList.toggle('on',k==i))};
go(0);d.forEach((e,i)=>e.onclick=()=>go(i));if(s.length>1)timer=setInterval(()=>go((n+1)%s.length),4000)}
/* 스크롤할 때 섹션이 서서히 나타남 */
let io;
function revealInit(){if(io)io.disconnect();const els=$$('.rv');if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});els.forEach(e=>io.observe(e))}

/* 자료: 이 브라우저에서 추가한 자료 + data.js 의 items */
const local=id=>store.get('items_'+id,[]);
const items=id=>local(id).concat(CAT[id].items.map(x=>({...x,id:String(x.id)})));
const allItems=()=>CATEGORIES.flatMap(c=>items(c.id).map(x=>({...x,cat:c.id}))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

const P={};
P.home=()=>`<section class="hero">${HERO_PHOTOS.map((u,i)=>`<div class="slide" data-src="${esc(u)}"><div><h1>${esc(SITE.title)}</h1><p>${esc(SITE.tagline)}</p></div></div>`).join('')}${HERO_PHOTOS.length>1?`<div class="dots">${HERO_PHOTOS.map((_,i)=>`<button type="button" aria-label="${i+1}번 사진"></button>`).join('')}</div>`:''}</section>
<section class="intro rv"><small>${esc(SITE.tagline)}</small><h2 class="serif">${CATEGORIES.map(c=>esc(c.name)).join(' · ')}</h2></section>
<div class="cards">${CATEGORIES.map((c,i)=>`<a class="rv" href="#/library/${c.id}"><div class="ph"><img src="${esc(photo(c,i))}" alt="" loading="lazy"></div><span>${pad(i+1)} · ${esc(c.name)}</span><em>${esc(c.desc)}</em></a>`).join('')}</div>
<section class="about rv"><h3>${esc(SITE.title)}.</h3><p>${esc(SITE.intro)}</p><a class="btn" href="#/library/all">자료 보기</a></section>
<section class="faq rv"><h3>처음 쓰실 때</h3><p>자주 헷갈리는 것만 모았습니다. 질문을 누르면 답이 펼쳐집니다.</p><div id="faq"></div></section>
<section class="band rv"><h3>${esc(SITE.tagline)}</h3><a class="btn f" href="#/library/all">전체 자료</a></section>`;
P.guide=()=>`<div class="page"><h1>처음 쓰실 때</h1><p class="sub1">GUIDE</p><div class="faq" style="padding:0"><div id="faq"></div></div><div style="text-align:center;margin-top:24px"><a class="btn f" href="#/library/all">자료 보러 가기</a></div></div>`;
P.library=(k,id)=>{k=CAT[k]?k:'all';
const tabs=`<div class="tabs">${[['all','ALL']].concat(CATEGORIES.map(c=>[c.id,c.name])).map(([t,n])=>`<a href="#/library/${t}" class="${t===k?'on':''}">${n}</a>`).join('')}</div>`;
if(id&&k!=='all'){const p=items(k).find(x=>String(x.id)===id);if(!p)return `<div class="page"><p class="sub1">자료를 찾을 수 없어요.</p><div style="text-align:center"><a class="btn" href="#/library/${k}">목록</a></div></div>`;
const mine=String(p.id).startsWith('u');
return `<div class="page post"><span class="tag">${esc(CAT[k].name)}</span><h2 style="margin-top:10px">${esc(p.title)}</h2><div class="meta">${esc(p.date||'')}${mine?' · 이 브라우저에서 추가한 자료':''}</div>
${p.link?`<a class="link" href="${esc(p.link)}" target="_blank" rel="noopener">원문 링크 열기 ↗</a>`:''}<p style="white-space:pre-wrap">${esc(p.body||'')}</p>
${(p.imgs||[]).length?`<div class="masonry">${p.imgs.map(u=>`<img src="${esc(u)}" alt="" loading="lazy" data-g="1">`).join('')}</div>`:''}
<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:40px"><a class="btn" href="#/library/${k}">목록</a>${mine?`<a class="btn" data-del="${esc(p.id)}">삭제</a>`:''}</div></div>`}
const list=k==='all'?allItems():items(k).map(x=>({...x,cat:k}));
const head=k==='all'?['Library','전체 자료']:[CAT[k].name,CAT[k].desc];
return `<div class="page"><h1>${esc(head[0])}</h1><p class="sub1">${esc(head[1])} · ${list.length}개</p>${tabs}
${list.length?`<table><tr><th class="no">No</th><th>제목</th><th>날짜</th></tr>${list.map((p,i)=>`<tr class="row" data-href="#/library/${p.cat}/${esc(p.id)}"><td class="no">${list.length-i}</td><td>${k==='all'?`<span class="tag">${esc(CAT[p.cat].name)}</span> `:''}${esc(p.title)}</td><td class="dt">${esc(p.date||'')}</td></tr>`).join('')}</table>`:'<p class="empty">아직 자료가 없어요. 자료가 생기면 이곳에 차곡차곡 쌓입니다.</p>'}
${k==='all'?'':`<div style="text-align:right"><a class="btn f" id="wr">자료 추가</a></div><form class="form" id="wf" hidden style="margin-top:28px"><label>제목<input name="title" required></label><label>링크 (선택)<input name="link" type="url" placeholder="https://"></label><label>사진 주소 (선택, 여러 개는 줄바꿈)<textarea name="imgs" rows="2"></textarea></label><label>메모<textarea name="body" rows="5"></textarea></label><button class="btn f" style="margin:0;justify-self:start">등록</button></form>`}</div>`};

function route(){clearInterval(timer);const [a,b,c]=location.hash.replace(/^#\/?/,'').split('/').map(decodeURIComponent);let h;
if(a==='library')h=P.library(b,c);else if(a==='guide')h=P.guide();else h=P.home();
$('#app').innerHTML=h;scrollTo(0,0);
faqInit();sliderInit();revealInit();
